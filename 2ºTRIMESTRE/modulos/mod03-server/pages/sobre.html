<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossas Redes | GrooveSamba</title>
    <!-- Ícones Modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta atualizada para Vermelho e Laranja */
            --primary: #ff4757;
            --secondary: #ff6b81;
            --orange: #ff7f50;
            --orange-bright: #ffa502;
            --dark: #1e1e24;
            --light: #f8f9fa;
            --glass: rgba(0, 0, 0, 0.65);
            --blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Imagem Base64 otimizada do Unsplash */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.9)), 
                        url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--light);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--orange);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1rem;
        }

        .container {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #bbb;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* Reprodutor de Áudio Simulado */
        .audio-player {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 127, 80, 0.2);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .player-controls .play-btn {
            background: linear-gradient(45deg, var(--primary), var(--orange));
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: var(--light);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .player-controls .play-btn:hover {
            transform: scale(1.05);
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--light);
        }

        .track-artist {
            font-size: 0.75rem;
            color: var(--orange);
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            position: relative;
        }

        .progress-fill {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--orange));
            border-radius: 2px;
        }

        /* Lista de Links */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-btn span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-btn i {
            font-size: 1.3rem;
        }

        .social-btn:hover {
            background: var(--light);
            color: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Efeitos de foco modernos com as novas cores */
        .social-btn.instagram:hover { border-color: var(--primary); color: var(--primary); }
        .social-btn.spotify:hover { border-color: #1ed760; color: #1ed760; }
        .social-btn.youtube:hover { border-color: var(--orange); color: var(--orange); }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--orange);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 50px;
        }

        .btn-back:hover {
            color: var(--primary);
            background: rgba(255, 71, 87, 0.1);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">
            <i class="fa-solid fa-drum"></i> Groove<span>Samba</span>
        </a>
    </header>

    <main>
        <div class="container">
            <h2>Nossa página é massa!</h2>
            <p class="subtitle">tudo sobre nossas redes</p>
            
            <!-- Reprodutor de Áudio Simulado -->
            <div class="audio-player">
                <div class="player-controls">
                    <button class="play-btn"><i class="fa-solid fa-play"></i></button>
                </div>
                <div class="track-info">
                    <div class="track-title">Coração Radiante (Ao Vivo)</div>
                    <div class="track-artist">GrooveSamba</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Links de Redes Sociais -->
            <div class="links-list">
                <a href="#" class="social-btn instagram" target="_blank">
                    <span><i class="fa-brands fa-instagram"></i> Instagram</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <a href="#" class="social-btn spotify" target="_blank">
                    <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <a href="#" class="social-btn youtube" target="_blank">
                    <span><i class="fa-brands fa-youtube"></i> YouTube</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <a href="/" class="btn-back">
                <i class="fa-solid fa-house"></i> Ir para Home
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GrooveSamba. Conecte-se com o nosso som.</p>
    </footer>

</body>
</html>
