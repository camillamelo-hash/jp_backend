<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resenha do Pagode | Oficial</title>
    <!-- Ícones Modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    

    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ffa502;
            --dark: #1e1e24;
            --light: #f8f9fa;
            --glass: rgba(255, 255, 255, 0.1);
            --blur: blur(10px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--light);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
        }

        .logo span {
            color: var(--primary);
        }

        .social-icons a {
            color: var(--light);
            font-size: 1.3rem;
            margin-left: 1.5rem;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--primary);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
        }

        .hero-card {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 3rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h3 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--light);
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .hero-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-drum"></i> Groove<span>Samba</span></div>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-spotify"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </header>

    <main>
        <div class="hero-card">
            <h3>Página Inicial</h3>
            <h1>Olá, você está em casa!</h1>
            <p>Aqueça o cavaquinho e solte a voz. O melhor do pagode e da nossa resenha começa agora.</p>
            <a href="/sobre" class="btn-primary">
                
                Conheça a Banda <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="/erro" class="report-link btn-primary">Erro</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GrooveSamba. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
